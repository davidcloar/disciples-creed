<svg viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Aged parchment ancient road map with roads radiating outward">
  <defs>
    <!-- Parchment base gradient -->
    <radialGradient id="parchment" cx="48%" cy="42%" r="75%">
      <stop offset="0%" stop-color="#ecdcb8"/>
      <stop offset="55%" stop-color="#e0cb9f"/>
      <stop offset="100%" stop-color="#c9ae7b"/>
    </radialGradient>

    <!-- Vignette / worn darkening toward edges -->
    <radialGradient id="vignette" cx="50%" cy="50%" r="72%">
      <stop offset="0%" stop-color="#4f3a1c" stop-opacity="0"/>
      <stop offset="72%" stop-color="#4f3a1c" stop-opacity="0"/>
      <stop offset="100%" stop-color="#4f3a1c" stop-opacity="0.55"/>
    </radialGradient>

    <!-- Mottled aging stains -->
    <filter id="mottle" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.011" numOctaves="4" seed="7" result="n"/>
      <feColorMatrix in="n" type="matrix"
        values="0 0 0 0 0.42
                0 0 0 0 0.31
                0 0 0 0 0.16
                0 0 0 1.6 -0.45"/>
    </filter>

    <!-- Fine paper fiber grain -->
    <filter id="fiber" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="3" result="n"/>
      <feColorMatrix in="n" type="matrix"
        values="0 0 0 0 0.30
                0 0 0 0 0.22
                0 0 0 0 0.12
                0 0 0 0.5 -0.22"/>
    </filter>

    <!-- Hand-drawn wobble for the linework -->
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="3" seed="11" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="5"/>
    </filter>

    <!-- Distressed worn border -->
    <filter id="tornedge">
      <feTurbulence type="fractalNoise" baseFrequency="0.03" numOctaves="4" seed="21" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="9"/>
    </filter>
  </defs>

  <!-- Base parchment -->
  <rect width="1600" height="1000" fill="url(#parchment)"/>

  <!-- Aging stains -->
  <rect width="1600" height="1000" filter="url(#mottle)" opacity="0.45" style="mix-blend-mode:multiply"/>
  <!-- Paper grain -->
  <rect width="1600" height="1000" filter="url(#fiber)" opacity="0.07" style="mix-blend-mode:multiply"/>

  <!-- Soft darker stains in a few spots -->
  <g style="mix-blend-mode:multiply" opacity="0.18" fill="#7a5a2c">
    <ellipse cx="240" cy="180" rx="180" ry="120"/>
    <ellipse cx="1380" cy="320" rx="220" ry="160"/>
    <ellipse cx="1150" cy="860" rx="240" ry="150"/>
    <ellipse cx="430" cy="820" rx="200" ry="130"/>
  </g>

  <!-- ===== CARTOGRAPHY ===== -->
  <g filter="url(#rough)" fill="none" stroke="#6f5328" stroke-linecap="round" stroke-linejoin="round">

    <!-- Coastline (west) with shoreline hachures -->
    <g opacity="0.5" stroke-width="3">
      <path d="M 175,30 C 120,170 215,275 150,400 S 100,590 195,700 S 130,860 185,990"/>
    </g>
    <g opacity="0.32" stroke-width="1.6">
      <path d="M 168,90 l 26,10"/>
      <path d="M 150,160 l 27,7"/>
      <path d="M 178,235 l 25,11"/>
      <path d="M 150,310 l 27,6"/>
      <path d="M 165,390 l 26,9"/>
      <path d="M 132,470 l 27,5"/>
      <path d="M 150,545 l 27,8"/>
      <path d="M 185,625 l 25,11"/>
      <path d="M 155,705 l 27,7"/>
      <path d="M 170,785 l 26,9"/>
      <path d="M 150,865 l 27,6"/>
      <path d="M 175,940 l 25,10"/>
    </g>

    <!-- River winding north to south -->
    <g opacity="0.4" stroke-width="2.2">
      <path d="M 1000,40 C 950,180 1030,300 970,430 S 900,660 985,780 S 940,910 995,990"/>
    </g>

    <!-- Hills: clusters of small bumps -->
    <g opacity="0.4" stroke-width="2">
      <path d="M 360,640 q 16,-20 32,0 q 16,-20 32,0 q 16,-20 32,0"/>
      <path d="M 380,665 q 16,-20 32,0 q 16,-20 32,0"/>
      <path d="M 720,720 q 16,-20 32,0 q 16,-20 32,0 q 16,-20 32,0"/>
      <path d="M 740,745 q 16,-20 32,0 q 16,-20 32,0"/>
      <path d="M 1180,560 q 16,-20 32,0 q 16,-20 32,0 q 16,-20 32,0"/>
      <path d="M 300,420 q 14,-17 28,0 q 14,-17 28,0"/>
    </g>

    <!-- Mountain ranges (carets) -->
    <g opacity="0.42" stroke-width="2.2">
      <path d="M 1240,200 l 26,-40 l 26,40 m -38,0 l 24,-32 l 24,32 m -36,0 l 22,-28 l 22,28"/>
      <path d="M 560,170 l 24,-36 l 24,36 m -36,0 l 22,-30 l 22,30 m -34,0 l 20,-26 l 20,26"/>
    </g>

    <!-- ROADS: a central hub near (640,420) radiating outward to all edges -->
    <g opacity="0.5" stroke-width="2.6">
      <!-- to top-left -->
      <path d="M 640,420 C 480,330 360,240 200,140"/>
      <!-- to top -->
      <path d="M 640,420 C 700,300 690,200 720,70"/>
      <!-- to top-right -->
      <path d="M 640,420 C 860,330 1060,250 1300,130"/>
      <!-- to right -->
      <path d="M 640,420 C 900,400 1180,380 1500,400"/>
      <!-- to bottom-right -->
      <path d="M 640,420 C 880,560 1100,700 1480,860"/>
      <!-- to bottom -->
      <path d="M 640,420 C 660,600 600,760 660,960"/>
      <!-- to bottom-left -->
      <path d="M 640,420 C 460,540 360,720 220,910"/>
      <!-- to left / coast -->
      <path d="M 640,420 C 460,420 340,440 240,470"/>
    </g>

    <!-- Roman-style double-line on two main routes (parallel faint inner line) -->
    <g opacity="0.3" stroke-width="1" stroke-dasharray="2 7">
      <path d="M 640,420 C 860,330 1060,250 1300,130"/>
      <path d="M 640,420 C 900,400 1180,380 1500,400"/>
      <path d="M 640,420 C 880,560 1100,700 1480,860"/>
    </g>

    <!-- A couple of crossing minor roads (dashed) -->
    <g opacity="0.3" stroke-width="1.6" stroke-dasharray="9 9">
      <path d="M 300,560 C 520,520 760,600 980,540 S 1340,500 1520,560"/>
      <path d="M 420,250 C 560,330 760,330 920,260 S 1240,300 1440,250"/>
    </g>

    <!-- Faint compass rose, lower-right, subtle -->
    <g opacity="0.28" stroke-width="1.6" transform="translate(1400,820)">
      <circle r="48"/>
      <circle r="30"/>
      <path d="M 0,-66 L 9,-9 L 66,0 L 9,9 L 0,66 L -9,9 L -66,0 L -9,-9 Z"/>
      <path d="M 0,-46 L 6,-6 L 46,0 L 6,6 L 0,46 L -6,6 L -46,0 L -6,-6 Z"/>
    </g>
  </g>

  <!-- Vignette -->
  <rect width="1600" height="1000" fill="url(#vignette)" style="mix-blend-mode:multiply"/>

  <!-- Distressed inset border -->
  <g filter="url(#tornedge)" fill="none" stroke="#5a4222" opacity="0.4">
    <rect x="46" y="46" width="1508" height="908" stroke-width="3"/>
    <rect x="62" y="62" width="1476" height="876" stroke-width="1.2"/>
  </g>
</svg>
